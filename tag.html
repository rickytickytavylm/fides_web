    <main class="wrap" style="padding:28px 0 48px">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a href="index.html">Главная</a><span>/</span><span>Тег</span>
      </nav>
      <header class="page-head">
        <p class="eyebrow">Метка</p>
        <h1 id="tag-title">Тег</h1>
        <p id="tag-desc" style="max-width:40em;color:var(--stone-700)">Подборка по метке. Авторы, темы и города задаются тегами в редакции.</p>
      </header>
      <div class="news-grid" id="tag-feed"><p class="ps-status">Загрузка…</p></div>
    </main>

    <script src="js/config.js?v=202608111520"></script>
    <script src="js/api.js?v=202608111520"></script>
    <script src="js/portal-nav.js?v=202608111520"></script>
    <script src="js/theme.js?v=202608111520"></script>
    <script>
      (function () {
        var V = window.Vera;
        var slug = new URLSearchParams(location.search).get('slug') || '';
        var titleEl = document.getElementById('tag-title');
        var feed = document.getElementById('tag-feed');
        if (titleEl) titleEl.textContent = slug ? slug.replace(/-/g, ' ') : 'Тег';
        document.title = (slug || 'Тег') + ' — ЯКатолик';
        if (!V || !slug) {
          if (feed) feed.innerHTML = '<p class="ps-status">Укажите ?slug=…</p>';
          return;
        }
        V.getArticles({ q: slug.replace(/-/g, ' '), limit: 20, page: 1 })
          .then(function (pack) {
            var items = pack.items || [];
            if (!items.length) {
              feed.innerHTML = '<p class="ps-status">Пока нет публикаций с этой меткой.</p>';
              return;
            }
            feed.innerHTML = '<div class="news-list">' + items.map(function (it) {
              return (
                '<a class="ncard" href="' + V.articleHref(it) + '">' +
                '<div class="thumb" style="background-image:' +
                (it.image ? "url('" + String(it.image).replace(/'/g, '%27') + "')" : 'linear-gradient(135deg,#553922,#8a6a3a)') +
                '"></div><div class="ncard-body"><h4>' + V.escapeHtml(it.title) + '</h4>' +
                '<div class="date">' + V.escapeHtml(V.formatDate(it.date)) + '</div></div></a>'
              );
            }).join('') + '</div>';
          })
          .catch(function () {
            feed.innerHTML = '<p class="ps-status">Не удалось загрузить</p>';
          });
      })();
    </script>
  </body>
</html>
