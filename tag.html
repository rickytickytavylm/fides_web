    <script>
      (function () {
        var V = window.Vera;
        var slug = new URLSearchParams(location.search).get('slug') || '';
        var titleEl = document.getElementById('tag-title');
        var feed = document.getElementById('tag-feed');
        if (titleEl) titleEl.textContent = slug ? slug.replace(/-/g, ' ') : 'Тег';
        document.title = (slug || 'Тег') + ' — Рускатолик';
        if (!V || !slug) {
          if (feed) feed.innerHTML = '<p class="ps-status">Укажите ?slug=…</p>';
          return;
        }
        function hasTag(it) {
          if (!it) return false;
          var tags = it.tags || [];
          var i;
          for (i = 0; i < tags.length; i++) {
            var t = tags[i];
            if (String((t && (t.slug || t.name || t)) || '').replace(/^tag:/, '') === slug) return true;
          }
          var cats = it.categorySlugs || it.rubrics || [];
          for (i = 0; i < cats.length; i++) {
            var s = String(cats[i] || '');
            if (s === slug || s === 'tag:' + slug || s.replace(/^tag:/, '') === slug) return true;
          }
          return false;
        }
        function titleFrom(items) {
          for (var i = 0; i < items.length; i++) {
            var tags = items[i].tags || [];
            for (var j = 0; j < tags.length; j++) {
              var t = tags[j];
              if (String((t && (t.slug || t)) || '').replace(/^tag:/, '') === slug) {
                return t.title || t.name || '';
              }
            }
          }
          return slug.replace(/-/g, ' ');
        }
        function paint(items, heading) {
          if (titleEl) titleEl.textContent = heading;
          document.title = heading + ' — Рускатолик';
          if (!items.length) {
            feed.innerHTML = '<p class="ps-status">Пока нет публикаций с этой меткой.</p>';
            return;
          }
          feed.innerHTML = '<div class="news-list">' + items.map(function (it) {
            return (
              '<a class="ncard" href="' + V.articleHref(it) + '">' +
              '<div class="thumb" style="background-image:' +
              (it.image ? "url('" + String(it.image).replace(/'/g, '%27') + "')" : 'linear-gradient(135deg,#553922,#8a6a3a)') +
              '"></div><div class="ncard-body"><h4>' + V.escapeHtml(it.title) + '</h4>' +
              '<div class="date">' + V.escapeHtml(V.formatDate(it.date)) + '</div></div></a>'
            );
          }).join('') + '</div>';
        }
        Promise.all([
          V.getArticles({ category: 'tag:' + slug, limit: 40, page: 1 }).catch(function () { return { items: [] }; }),
          V.getArticles({ q: slug.replace(/-/g, ' '), limit: 40, page: 1 }).catch(function () { return { items: [] }; }),
          V.getArticles({ limit: 40, page: 1 }).catch(function () { return { items: [] }; }),
        ]).then(function (packs) {
          var seen = {};
          var items = [];
          packs.forEach(function (pack) {
            (pack.items || []).forEach(function (it) {
              var key = String(it.id || it.slug || it.title || '');
              if (!key || seen[key] || !hasTag(it)) return;
              seen[key] = 1;
              items.push(it);
            });
          });
          items.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
          paint(items, titleFrom(items));
        }).catch(function () {
          feed.innerHTML = '<p class="ps-status">Не удалось загрузить</p>';
        });
      })();
    </script>
