  <body class="map-page">
    <header class="masthead">
      <div class="wrap">
        <a class="logo" href="index.html">
          <span class="mark"><img src="yakatolik-logo.svg" alt="ЯКатолик" width="34" height="34" /></span>
          <span class="wm">ЯКатолик</span>
        </a>
        <nav class="top" aria-label="Разделы">
          <a href="archive.html?category=news">Новости</a>
          <a href="archive.html?category=columns">Статьи</a>

        </nav>
        <a class="search" href="archive.html">🔍 Поиск</a>
      </div>
    </header>

    <section class="map-shell">
      <aside class="map-side" id="map-side">
        <div class="map-side-head">
          <div class="block-head" style="margin:0">
            <span class="kicker"></span>
            <h2>Храмы</h2>
            <span class="chip v1" id="map-mode" hidden></span>
          </div>
          <p class="map-meta">Католические приходы России</p>
          <label class="ps-search map-search">
            <span aria-hidden="true">🔍</span>
            <input id="map-search" type="search" placeholder="Название, город, епархия…" autocomplete="off" />
          </label>
          <div class="map-actions">
            <button type="button" id="map-locate">Рядом</button>
            <button type="button" id="map-russia">Вся Россия</button>
          </div>
          <p class="map-status" id="map-status"></p>
        </div>
        <div class="map-list" id="map-list"></div>
      </aside>

      <div class="map-stage">
        <div id="map-canvas" role="application" aria-label="Карта храмов"></div>

        <!-- Мобильный оверлей: поиск поверх карты -->
        <div class="map-float" id="map-float">
          <label class="map-float-search">
            <span aria-hidden="true">🔍</span>
            <input id="map-search-mobile" type="search" placeholder="Найти храм…" autocomplete="off" />
          </label>
          <div class="map-float-actions">
            <button type="button" id="map-locate-mobile" aria-label="Рядом">◎</button>
            <button type="button" id="map-russia-mobile" aria-label="Вся Россия">RU</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Карточка храма: desktop — в сайдбаре через JS-клон; mobile — bottom sheet -->
    <div class="map-sheet" id="map-sheet" hidden>
      <div class="map-sheet-backdrop" id="map-sheet-backdrop"></div>
      <div class="map-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="map-sheet-title">
        <div class="map-sheet-handle" aria-hidden="true"></div>
        <div class="map-sheet-body" id="map-sheet-body"></div>
      </div>
    </div>
