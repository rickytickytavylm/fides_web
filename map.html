    <script id="yak_theme_boot">
(function(){
  try{document.documentElement.dataset.theme=localStorage.getItem('yak_theme')==='twilight'?'twilight':'light'}catch(e){document.documentElement.dataset.theme='light'}
  try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}catch(e){}
  try{if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}catch(e){}
  var s=document.createElement('style');
  s.id='yak-emergency-css';
  s.textContent='.cal-btn svg,.tab-item svg,.masthead svg,.logo img{width:22px!important;height:22px!important;max-width:22px!important}.cal-btn,.tab-item{width:40px;height:40px;overflow:hidden}';
  document.documentElement.appendChild(s);
})();
</script>
