<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Карта католических храмов — ЯКатолик" />
    <title>Карта храмов — ЯКатолик</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="icon" href="yakatolik-logo.svg" />
    <link rel="apple-touch-icon" href="yakatolik-logo.svg" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#201E24" />
    <link rel="stylesheet" href="portal.css?v=9" />
  </head>
  <body class="map-page">
    <header class="masthead">
      <div class="wrap">
        <a class="logo" href="index.html">
          <span class="mark"><img src="yakatolik-logo.svg" alt="ЯКатолик" width="34" height="34" /></span>
          <span class="wm">ЯКатолик</span>
        </a>
        <nav class="top" aria-label="Разделы">
          <a href="archive.html?category=news">Новости</a>
          <a href="archive.html?category=columns">Статьи</a>
          <a href="map.html">Карта</a>
          <a href="archive.html?category=polka">Библиотека</a>
          <a href="chat.html">Спросить</a>
        </nav>
        <a class="search" href="archive.html">🔍 Поиск</a>
      </div>
    </header>

    <section class="map-shell">
      <aside class="map-side">
        <div class="map-side-head">
          <div class="block-head" style="margin:0">
            <span class="kicker"></span>
            <h2>Храмы</h2>
            <span class="chip v1" id="map-mode">live</span>
          </div>
          <p class="map-meta" id="map-stats">католические приходы России</p>
          <label class="ps-search map-search">
            <span aria-hidden="true">🔍</span>
            <input id="map-search" type="search" placeholder="Название, город, епархия…" />
          </label>
          <div class="map-actions">
            <button type="button" id="map-locate">Рядом</button>
            <button type="button" id="map-russia">Вся Россия</button>
          </div>
          <p class="map-status" id="map-status"></p>
          <p class="map-count" id="map-count"></p>
        </div>
        <div class="map-list" id="map-list"></div>
        <div class="map-detail" id="map-detail" hidden></div>
        <p class="map-handnote">Подключение своего API: <code>js/config.js</code> → <code>TEMPLES_API_BASE</code>. Контракт и допущения — в <a href="docs/MAPS.md">docs/MAPS.md</a>.</p>
      </aside>
      <div id="map-canvas" role="application" aria-label="Карта храмов"></div>
    </section>

    <nav class="app-tabbar" aria-label="Основная навигация">
      <a class="tab-item" href="index.html" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.5 12 4l7.5 6.5V20a1 1 0 0 1-1 1h-4.2v-5.2h-4.6V21H5.5a1 1 0 0 1-1-1v-9.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Главная</span>
      </a>
      <a class="tab-item" href="archive.html?category=news" data-tab="news">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v13H5z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 12.5h8M8 16h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Новости</span>
      </a>
      <a class="tab-item" href="archive.html?category=columns" data-tab="articles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v15H6z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 8.5h6M9 12h6M9 15.5h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Статьи</span>
      </a>
      <a class="tab-item" href="map.html" data-tab="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5 4.5 6.2v13.3L9 17.8l6 1.7 4.5-1.7V4.5L15 6.2 9 4.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 4.5v13.3M15 6.2v13.3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>Карта</span>
      </a>
      <a class="tab-item" href="chat.html" data-tab="chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 6.5h13a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H10l-3.8 2.6V16.5H5.5A1.5 1.5 0 0 1 4 15V8a1.5 1.5 0 0 1 1.5-1.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Спросить</span>
      </a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/config.js?v=9"></script>
    <script src="js/temples-api.js?v=9"></script>
    <script src="js/portal-nav.js?v=9"></script>
    <script src="js/map-page.js?v=9"></script>
  </body>
</html>
