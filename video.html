<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Видео — Вера и Разум" />
    <title>Видео — Вера и Разум</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="brand-logo.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#100b07" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Вера и Разум" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-brandbar">
      <a class="brand" href="index.html" aria-label="Вера и Разум — на главную">
        <img class="brand-logo" src="brand-logo.png" alt="" width="32" height="32" />
        <span class="brand-text">Вера и Разум</span>
      </a>
    </header>


<main class="page-shell">
      <nav class="breadcrumbs in-shell" aria-label="Хлебные крошки">
        <a href="index.html">Главная</a><span>/</span><span>Видео</span>
      </nav>

      <header class="page-head in-shell">
        <div>
          <p class="eyebrow">Смотреть</p>
          <h1>Видео</h1>
        </div>
        <p class="page-desc">Короткие размышления и полные фильмы — для паузы, молитвы и разговора о вере.</p>
      </header>

      <div class="video-tabs" id="video-tabs">
        <button type="button" class="chip active" data-type="all">Все</button>
        <button type="button" class="chip" data-type="short">Shorts</button>
        <button type="button" class="chip" data-type="long">Длинные</button>
      </div>

      <p class="archive-loading" id="video-status">Загрузка…</p>
      <div class="video-grid web-video-grid" id="video-grid"></div>
    </main>

    <dialog class="video-dialog" id="video-dialog">
      <form method="dialog" class="video-dialog-bar">
        <p id="video-dialog-title"></p>
        <button type="submit" class="ghost-button" value="close">Закрыть</button>
      </form>
      <video id="video-player" controls playsinline></video>
    </dialog>

    <footer class="site-footer">
      <div class="footer-brand">
        <img class="brand-logo" src="brand-logo.png" alt="" width="40" height="40" />
        <div>
          <strong>Вера и Разум</strong>
          <p>Видео и архив</p>
        </div>
      </div>
      <p class="footer-copy">© Вера и Разум</p>
    </footer>

    <nav class="app-tabbar" aria-label="Основная навигация">
      <a class="tab-item" href="index.html" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.5 12 4l7.5 6.5V20a1 1 0 0 1-1 1h-4.2v-5.2h-4.6V21H5.5a1 1 0 0 1-1-1v-9.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Главная</span>
      </a>
      <a class="tab-item" href="archive.html" data-tab="archive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v15H6z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 8.5h6M9 12h6M9 15.5h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Архив</span>
      </a>
      <a class="tab-item" href="audio.html" data-tab="audio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6.8l10-2.3V16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>Аудио</span>
      </a>
      <a class="tab-item" href="video.html" data-tab="video">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.2 9.2v5.6L15.4 12z" fill="currentColor"/></svg>
        <span>Видео</span>
      </a>
      <a class="tab-item" href="chat.html" data-tab="chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 6.5h13a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H10l-3.8 2.6V16.5H5.5A1.5 1.5 0 0 1 4 15V8a1.5 1.5 0 0 1 1.5-1.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Чат</span>
      </a>
    </nav>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/video.js"></script>
      
  </body>
</html>
