<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Чат о вере — Вера и Разум" />
    <title>Чат — Вера и Разум</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet" />
    <link rel="icon" href="brand-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="chat-page">
    <header class="site-header solid">
      <a class="brand" href="index.html" aria-label="Вера и Разум — на главную">
        <img class="brand-logo" src="brand-logo.png" alt="" width="36" height="36" />
        <span class="brand-text">Вера и Разум</span>
      </a>
      <button class="menu-toggle" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span></button>
      <nav class="main-nav" aria-label="Основная навигация">
        <div class="nav-item"><a href="index.html">Главная</a></div>
        <div class="nav-item"><a href="archive.html">Архив</a></div>
        <div class="nav-item"><a href="video.html">Видео</a></div>
        <div class="nav-item"><a href="audio.html">Аудио</a></div>
        <div class="nav-item"><a href="chat.html">Чат</a></div>
      </nav>
      <div class="header-actions">
        <a class="support-link" href="archive.html">Архив</a>
      </div>
    </header>

    <main class="chat-shell">
      <header class="chat-intro">
        <p class="eyebrow">Диалог</p>
        <h1>Спросите о вере</h1>
        <p class="chat-intro-text">Спокойные ответы о Катехизисе, молитве и христианской жизни. Не заменяет священника — помогает сориентироваться.</p>
      </header>

      <div class="chat-panel">
        <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
        <form class="chat-composer" id="chat-form">
          <textarea id="chat-input" rows="1" placeholder="Напишите вопрос…" maxlength="2000" required></textarea>
          <button type="submit" class="chat-send" id="chat-send" aria-label="Отправить">↑</button>
        </form>
        <p class="chat-hint" id="chat-hint">Enter — отправить · Shift+Enter — новая строка</p>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
