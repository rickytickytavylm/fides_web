  <body class="chat-page">
    <header class="masthead">
      <div class="wrap">
        <a class="chat-back" href="index.html" aria-label="Назад на главную">←</a>
        <a class="logo" href="index.html">
          <span class="mark"><img src="yakatolik-logo.svg" alt="ЯКатолик" width="34" height="34" /></span>
          <span class="wm">ЯКатолик</span>
        </a>
      </div>
    </header>

    <main class="chat-shell">
      <header class="chat-intro">
        <p class="eyebrow">Диалог</p>
        <h1>Спросите о вере</h1>
        <p class="chat-intro-text">Спокойные ответы о Катехизисе, молитве и христианской жизни. Не заменяет священника — помогает сориентироваться.</p>
      </header>

      <div class="chat-panel">
        <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
        <form class="chat-composer" id="chat-form">
          <textarea id="chat-input" rows="1" placeholder="Напишите вопрос…" maxlength="2000" required></textarea>
          <button type="submit" class="chat-send" id="chat-send" aria-label="Отправить">↑</button>
        </form>
        <p class="chat-hint" id="chat-hint">Enter — отправить · Shift+Enter — новая строка</p>
      </div>
    </main>
