<!doctype html>
<html lang="ru" class="chat-lock">
  <head>
    <meta charset="UTF-8" />
    <!-- Без pinch/focus-zoom. interactive-widget не ставим — на iOS даёт «улетание» -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Спросите о вере — ЯКатолик" />
    <title>Спросить — ЯКатолик</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="yakatolik-logo.svg" />
    <link rel="apple-touch-icon" href="yakatolik-logo.svg" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#ede9e2" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <script>window.YAK_BUILD = '202608111600';</script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ЯКатолик" />
    <meta name="format-detection" content="telephone=no" />
    <script id="yak_theme_boot">try{document.documentElement.dataset.theme=localStorage.getItem('yak_theme')==='twilight'?'twilight':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
    <link rel="stylesheet" href="portal.css?v=202608111600" />
  </head>
  <body class="chat-page">
    <div class="chat-app" id="chat-app">
      <header class="masthead">
        <div class="wrap">
          <a class="chat-back" href="index.html" aria-label="Назад на главную">←</a>
          <a class="logo" href="index.html">
            <span class="mark"><img src="yakatolik-logo.svg" alt="ЯКатолик" width="34" height="34" /></span>
            <span class="wm">ЯКатолик</span>
          </a>
        </div>
      </header>

      <main class="chat-shell">
        <header class="chat-intro">
          <p class="eyebrow">Диалог</p>
          <h1>Спросите о вере</h1>
          <p class="chat-intro-text">Ответы о вере — и помощь сориентироваться по разделам портала. Не заменяет священника</p>
        </header>

        <div class="chat-panel">
          <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
          <form class="chat-composer" id="chat-form">
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Напишите вопрос…"
              maxlength="2000"
              required
              enterkeyhint="send"
              autocomplete="off"
              autocorrect="on"
              autocapitalize="sentences"
              spellcheck="true"
            ></textarea>
            <button type="submit" class="chat-send" id="chat-send" aria-label="Отправить">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M12 5l-6 6M12 5l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>
          <p class="chat-hint" id="chat-hint">Enter — отправить · Shift+Enter — новая строка</p>
        </div>
      </main>
    </div>

    <script src="js/config.js?v=202608111600"></script>
    <script src="js/api.js?v=202608111600"></script>
    <script src="js/site-guide.js?v=202608111600"></script>
    <script src="js/chat.js?v=202608111600"></script>
    <script src="js/theme.js?v=202608111600"></script>
    <script src="js/cache-bust.js?v=202608111600"></script>
  </body>
</html>
