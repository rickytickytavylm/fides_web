  <body class="chat-page">
    <div class="chat-app" id="chat-app">
      <header class="masthead">
        <div class="wrap">
          <a class="chat-back" href="index.html" aria-label="Назад на главную">←</a>
          <a class="logo" href="index.html">
            <span class="mark"><img src="mark-p.png" alt="Рускатолик" width="34" height="34" /></span>
            <span class="wm">Рускатолик</span>
          </a>
        </div>
      </header>

      <main class="chat-shell">
        <header class="chat-intro">
          <p class="eyebrow">Диалог</p>
          <h1>Спросите о вере</h1>
          <p class="chat-intro-text">Ответы о вере — и помощь сориентироваться по разделам портала. Не заменяет священника</p>
        </header>

        <div class="chat-panel">
          <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
          <form class="chat-composer" id="chat-form">
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Напишите вопрос…"
              maxlength="2000"
              required
              enterkeyhint="send"
              autocomplete="off"
              autocorrect="on"
              autocapitalize="sentences"
              spellcheck="true"
            ></textarea>
            <button type="submit" class="chat-send" id="chat-send" aria-label="Отправить">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M12 5l-6 6M12 5l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>
          <p class="chat-hint" id="chat-hint">Enter — отправить · Shift+Enter — новая строка</p>
        </div>
      </main>
    </div>
